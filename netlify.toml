[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/generate-cat-image"
  to = "/.netlify/functions/generate-cat-image"
  status = 200

[[redirects]]
  from = "/api/deepseek-chat"
  to = "/.netlify/functions/deepseek-chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
